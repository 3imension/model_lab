<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOLAB - 관리자 페이지</title>
    <link rel="stylesheet" href="style.css?v=3.3">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="main-header">
            <a href="index.html" class="logo-area">
                <div class="logo-icon">ML</div>
                <div class="logo-text">
                    <h1>MOLAB 관리자</h1>
                    <span>Plastic model & 3D Printing Studio NOWON Goneung</span>
                </div>
            </a>
            <nav class="nav-buttons" id="nav-buttons"></nav>
        </header>

        <main class="card-section">
            <h3 style="margin-bottom: 12px;">메인 공지 이미지 게시/업로드</h3>
            <div style="background:#f8fafc; border:1px solid #cbd5e1; padding:15px; border-radius:8px; margin-bottom: 30px;">
                <div class="form-group">
                    <label>이미지 파일 선택 (JPG, PNG)</label>
                    <input type="file" id="admin-img-file" accept="image/*" style="background:#fff; padding:8px;">
                </div>
                
                <div id="img-preview-wrap" style="margin: 10px 0; display:none; background:#fff; padding:10px; border-radius:6px; border:1px solid #e2e8f0;">
                    <p style="font-size:0.8rem; font-weight:bold; color:#475569; margin-bottom:6px;">[현재 게시 중인 이미지 배너]</p>
                    <img id="img-preview" style="max-height: 120px; width: auto; border-radius: 6px; border:1px solid #cbd5e1;">
                </div>

                <div class="form-row" style="margin-top:12px; gap:10px;">
                    <button onclick="uploadNoticeImage()" id="upload-btn" class="nav-btn btn-primary">이미지 게시하기</button>
                    <button onclick="deleteNoticeImage()" class="nav-btn btn-danger">게시된 이미지 삭제</button>
                </div>
            </div>

            <!-- 2. 회원 목록 (정렬 옵션 + 상하 스크롤 + 이력 드롭다운 적용) -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
                <h3 style="margin: 0;">2. 회원 목록 및 클래스 승인 관리</h3>
                
                <div style="display: flex; align-items: center; gap: 8px;">
                    <label style="font-size: 0.85rem; font-weight: bold;">회원 정렬:</label>
                    <select id="user-sort-key" onchange="renderUserList()" style="width: 170px; padding: 6px; font-size: 0.85rem;">
                        <option value="priority">승인/재승인대기 우선</option>
                        <option value="regDate">가입일자 최신순</option>
                        <option value="name">실명순 (가나다)</option>
                        <option value="id">아이디순</option>
                    </select>
                </div>
            </div>

            <!-- 회원 목록 상하 스크롤 박스 -->
            <div style="max-height: 420px; overflow-y: auto; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 35px;">
                <table class="admin-table" style="margin-top: 0; border: none;">
                    <thead style="position: sticky; top: 0; z-index: 10; background: #f8fafc;">
                        <tr>
                            <th>가입일자</th>
                            <th>아이디</th>
                            <th>실명</th>
                            <th>연락처</th>
                            <th style="width:20%;">신청 클래스 이력</th>
                            <th>현재 클래스</th>
                            <th>사용시간</th>
                            <th>승인 상태</th>
                            <th>처리 / 시간 재승인</th>
                        </tr>
                    </thead>
                    <tbody id="admin-user-list"></tbody>
                </table>
            </div>

            <!-- 3. 월간 캘린더 및 일자별 좌석 현황 -->
            <div style="border-top: 2px dashed #e2e8f0; padding-top: 25px; margin-bottom: 35px;">
                <h3 style="margin-bottom: 15px;">3. 월간 캘린더 및 일자별 좌석 현황</h3>
                <div class="calendar-nav-header">
                    <button id="admin-prev-btn" class="nav-btn btn-secondary">&lt; 이전 달</button>
                    <h3 id="admin-month-title"></h3>
                    <button id="admin-next-btn" class="nav-btn btn-secondary">다음 달 &gt;</button>
                </div>

                <div id="admin-calendar-grid" class="monthly-calendar-grid"></div>

                <div id="admin-day-detail" class="day-detail-card" style="margin-top: 20px; padding-top: 15px; border-top: 1px solid #e2e8f0;">
                    <h4 id="admin-detail-title" style="margin-bottom: 12px; font-size: 1.05rem; color: #1e293b;">날짜를 클릭하면 해당 날짜의 좌석별 예약자가 표시됩니다.</h4>
                    <div id="admin-detail-slots" class="slots-container"></div>
                </div>
            </div>

            <!-- 4. 전체 회원 예약 현황 -->
            <div style="border-top: 2px dashed #e2e8f0; padding-top: 25px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
                    <h3 style="margin: 0;">4. 전체 회원 예약 현황</h3>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <label style="font-size: 0.85rem; font-weight: bold;">정렬 기준:</label>
                        <select id="sort-key-select" onchange="applyBookingSort()" style="width: 140px; padding: 6px; font-size: 0.85rem;">
                            <option value="created">전체보기 (등록순)</option>
                            <option value="date">날짜/월별 기준</option>
                            <option value="time">시간대 기준</option>
                            <option value="userId">아이디 기준</option>
                            <option value="classType">클래스 기준</option>
                        </select>

                        <select id="sort-order-select" onchange="applyBookingSort()" style="width: 110px; padding: 6px; font-size: 0.85rem;">
                            <option value="asc">오름차순 ▲</option>
                            <option value="desc">내림차순 ▼</option>
                        </select>
                    </div>
                </div>

                <div style="max-height: 400px; overflow-y: auto; border: 1px solid #cbd5e1; border-radius: 8px;">
                    <table class="admin-table" style="margin-top: 0; border: none;">
                        <thead style="position: sticky; top: 0; z-index: 10; background: #f8fafc;">
                            <tr>
                                <th>예약 날짜</th><th>시간대</th><th>좌석</th><th>회원 ID</th><th>회원 이름</th><th>클래스</th><th>상태</th>
                            </tr>
                        </thead>
                        <tbody id="admin-booking-list"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
    <script>
        const session = getCurrentUser();
        if(!session || session.id !== '3imension') {
            alert('관리자 전용 페이지입니다.');
            window.location.href = 'login.html';
        }

        const now = new Date();
        let adminYear = now.getFullYear();
        let adminMonth = now.getMonth();
        const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

        let cachedBookings = [];
        let cachedUsersMap = {};
        let rawUsersList = [];

        function loadNoticeImageAdmin() {
            if(!db) return;
            db.collection('settings').doc('notice_image').get().then(doc => {
                if (doc.exists && doc.data().url) {
                    document.getElementById('img-preview').src = doc.data().url;
                    document.getElementById('img-preview-wrap').style.display = 'block';
                } else {
                    document.getElementById('img-preview-wrap').style.display = 'none';
                }
            });
        }

        function uploadNoticeImage() {
            const fileInput = document.getElementById('admin-img-file');
            const btn = document.getElementById('upload-btn');
            if (!fileInput.files || !fileInput.files[0]) {
                return alert('업로드할 이미지 파일을 선택해 주세요.');
            }

            const file = fileInput.files[0];
            btn.disabled = true;
            btn.textContent = '압축 업로드 중...';

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const max_size = 600;

                    if (width > height) {
                        if (width > max_size) { height *= max_size / width; width = max_size; }
                    } else {
                        if (height > max_size) { width *= max_size / height; height = max_size; }
                    }
                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);

                    db.collection('settings').doc('notice_image').set({
                        url: compressedBase64,
                        updatedAt: new Date()
                    }).then(() => {
                        alert('이미지 게시가 완료되었습니다.');
                        loadNoticeImageAdmin();
                    }).catch(err => {
                        alert(`업로드 실패: ${err.message}`);
                    }).finally(() => {
                        btn.disabled = false;
                        btn.textContent = '이미지 게시하기';
                    });
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function deleteNoticeImage() {
            if(!confirm('게시된 공지 이미지를 삭제하시겠습니까?')) return;
            await db.collection('settings').doc('notice_image').delete();
            document.getElementById('img-preview-wrap').style.display = 'none';
            document.getElementById('admin-img-file').value = '';
            alert('이미지가 삭제되었습니다.');
        }

        function getBookingStatusInfo(dateStr, timeStr) {
            if (dateStr < todayStr) {
                return { code: 3, html: `<span style="background:#cbd5e1; color:#475569; padding:4px 8px; border-radius:4px; font-size:0.78rem; font-weight:bold;">사용완료</span>` };
            } else if (dateStr > todayStr) {
                return { code: 2, html: `<span style="background:#dbeafe; color:#1d4ed8; padding:4px 8px; border-radius:4px; font-size:0.78rem; font-weight:bold;">예약중</span>` };
            } else {
                return { code: 1, html: `<span style="background:#dcfce7; color:#15803d; padding:4px 8px; border-radius:4px; font-size:0.78rem; font-weight:bold;">당일 예약</span>` };
            }
        }

        function getClassTitle(code) {
            const map = {
                'BASIC_1': 'BASIC (1회/5시간)',
                'BASIC_4': 'BASIC (4회/20시간)',
                'BASIC_8': 'BASIC (8회/40시간)',
                'BASIC_16': 'BASIC (16회/80시간)',
                'FREE_PASS': '자유이용권',
                'CREATOR': 'CREATOR (8회/40시간)'
            };
            return map[code] || code || '미지정';
        }

        function applyBookingSort() {
            const sortKey = document.getElementById('sort-key-select').value;
            const sortOrder = document.getElementById('sort-order-select').value;

            let list = [...cachedBookings];

            list.sort((a, b) => {
                let valA = a[sortKey] || '';
                let valB = b[sortKey] || '';

                if (sortKey === 'classType') {
                    valA = cachedUsersMap[a.userId]?.classType || '미지정';
                    valB = cachedUsersMap[b.userId]?.classType || '미지정';
                }

                if (valA < valB) return sortOrder === 'asc' ? -1 : 1;
                if (valA > valB) return sortOrder === 'asc' ? 1 : -1;
                return 0;
            });

            const bookingListElem = document.getElementById('admin-booking-list');
            bookingListElem.innerHTML = list.length === 0 ? '<tr><td colspan="7">예약 내역이 없습니다.</td></tr>' : '';

            list.forEach(b => {
                const statusInfo = getBookingStatusInfo(b.date, b.time || '');
                const userObj = cachedUsersMap[b.userId] || {};
                let userClass = getClassTitle(userObj.classType);
                if(userObj.passSeat) userClass += `(${userObj.passSeat})`;

                // 🛑 4번 전체 예약 현황에서도 탈퇴 회원은 아이디(탈퇴) 빨간색 표기
                let displayUserIdHTML = b.userId;
                if (userObj.isDeleted) {
                    displayUserIdHTML = `<strong style="color:#ef4444;">${b.userId}(탈퇴)</strong>`;
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${b.date}</td>
                    <td>${b.time}</td>
                    <td><strong style="color:#2563eb;">${b.seat}</strong></td>
                    <td>${displayUserIdHTML}</td>
                    <td>${b.userName || userObj.name || '-'}</td>
                    <td><span style="font-size:0.8rem; color:#475569;">${userClass}</span></td>
                    <td>${statusInfo.html}</td>
                `;
                bookingListElem.appendChild(tr);
            });
        }

        // 🌟 회원 목록 렌더링 (우선순위 정렬 + 드롭다운 이력 지원)
        function renderUserList() {
            const userListElem = document.getElementById('admin-user-list');
            userListElem.innerHTML = '';

            const sortKey = document.getElementById('user-sort-key').value;
            let sortedUsers = [...rawUsersList];

            sortedUsers.sort((a, b) => {
                const totalA = Number(a.totalHours || 0);
                const usedA = Number(a.usedHours || 0);
                const isExpiredA = a.approved && (totalA <= usedA);
                const isPendingA = !a.approved && !a.isDeleted;

                const totalB = Number(b.totalHours || 0);
                const usedB = Number(b.usedHours || 0);
                const isExpiredB = b.approved && (totalB <= usedB);
                const isPendingB = !b.approved && !b.isDeleted;

                if (sortKey === 'priority') {
                    // 1순위: 승인대기 회원이 최상단
                    if (isPendingA && !isPendingB) return -1;
                    if (!isPendingA && isPendingB) return 1;
                    
                    // 2순위: 재승인이 필요한 만료 회원이 상단
                    if (isExpiredA && !isExpiredB) return -1;
                    if (!isExpiredA && isExpiredB) return 1;

                    // 3순위: 탈퇴 회원은 하단 배치
                    if (a.isDeleted && !b.isDeleted) return 1;
                    if (!a.isDeleted && b.isDeleted) return -1;
                } else if (sortKey === 'regDate') {
                    const timeA = a.createdAt?.seconds || 0;
                    const timeB = b.createdAt?.seconds || 0;
                    return timeB - timeA;
                } else if (sortKey === 'name') {
                    return (a.name || '').localeCompare(b.name || '');
                } else if (sortKey === 'id') {
                    return (a.id || '').localeCompare(b.id || '');
                }
                return 0;
            });

            sortedUsers.forEach(u => {
                const total = Number(u.totalHours || 0);
                const used = Number(u.usedHours || 0);
                const isExpired = u.approved && (total <= used);

                const usedCount = Math.floor(used / 5);
                const totalCount = Math.floor(total / 5);

                let regDateStr = '-';
                if (u.createdAt) {
                    const dateObj = u.createdAt.toDate ? u.createdAt.toDate() : new Date(u.createdAt);
                    regDateStr = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
                }

                // 📜 신청 클래스 이력 드롭다운(Select) 변환
                let historyDropdownHTML = '<span style="color:#94a3b8; font-size:0.8rem;">이력 없음</span>';
                if (u.classHistory && Array.isArray(u.classHistory) && u.classHistory.length > 0) {
                    historyDropdownHTML = `<select style="font-size:0.78rem; padding:4px; border-color:#cbd5e1; max-width:100%;">`;
                    u.classHistory.forEach((cCode, idx) => {
                        historyDropdownHTML += `<option value="${cCode}">${idx + 1}차: ${getClassTitle(cCode)}</option>`;
                    });
                    historyDropdownHTML += `</select>`;
                }

                let currentClassHTML = getClassTitle(u.classType);
                if(u.passSeat) currentClassHTML += `<br><span style="font-size:0.75rem; color:#2563eb;">(${u.passSeat} 지정)</span>`;

                // 🛑 탈퇴 회원 아이디 옆에 빨간색 (탈퇴) 표기
                let displayIdHTML = `<strong>${u.id}</strong>`;
                let statusBadgeHTML = `<span class="badge-status ${u.approved ? 'approved' : 'pending'}">${u.approved ? '승인완료' : '승인대기'}</span>`;
                let actionBtnHTML = '';

                if (u.isDeleted) {
                    displayIdHTML = `<strong style="color:#ef4444;">${u.id}(탈퇴)</strong>`;
                    statusBadgeHTML = `<span style="background:#fecdd3; color:#991b1b; padding:2px 8px; border-radius:12px; font-size:0.75rem; font-weight:bold;">탈퇴 회원</span>`;
                    actionBtnHTML = `<span style="color:#94a3b8; font-size:0.8rem;">처리 불가</span>`;
                } else {
                    actionBtnHTML = `
                        ${!u.approved ? `<button onclick="approveUser('${u.id}')" class="nav-btn btn-success" style="padding:4px 8px;">클래스 승인</button>` : ''}
                        ${isExpired || u.approved ? `<button onclick="reApproveUser('${u.id}')" class="nav-btn btn-primary" style="padding:4px 8px; margin-top:2px;">시간 재승인</button>` : ''}
                    `;
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-size:0.8rem; color:#64748b;">${regDateStr}</td>
                    <td>${displayIdHTML}</td>
                    <td>${u.name || '-'}</td>
                    <td>${u.phone || '-'}</td>
                    <td>${historyDropdownHTML}</td>
                    <td><span style="font-size:0.82rem; font-weight:bold; color:#1e293b;">${currentClassHTML}</span></td>
                    <td>
                        <b>${usedCount}회 / ${totalCount}회</b><br>
                        <span style="font-size:0.75rem; color:#64748b;">(${used}h / ${total}h)</span>
                        ${isExpired && !u.isDeleted ? '<br><b style="color:#ef4444; font-size:0.75rem;">[만료됨]</b>' : ''}
                    </td>
                    <td>${statusBadgeHTML}</td>
                    <td>${actionBtnHTML}</td>
                `;
                userListElem.appendChild(tr);
            });
        }

        function listenAdminData() {
            if(!db) return;

            db.collection('users').onSnapshot(snapshot => {
                rawUsersList = [];
                cachedUsersMap = {};

                snapshot.docs.forEach(doc => {
                    const u = doc.data();
                    if (u.id === '3imension') return;
                    cachedUsersMap[u.id] = u;
                    rawUsersList.push(u);
                });

                renderUserList();
                applyBookingSort();
            });

            db.collection('bookings').onSnapshot(snapshot => {
                cachedBookings = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                applyBookingSort();
                renderAdminCalendar();
            });
        }

        function renderAdminCalendar() {
            document.getElementById('admin-month-title').textContent = `${adminYear}년 ${adminMonth + 1}월`;
            const grid = document.getElementById('admin-calendar-grid');
            grid.innerHTML = '';

            const headers = ['일','월','화','수','목','금','토'];
            headers.forEach(h => grid.appendChild(Object.assign(document.createElement('div'), {className:'calendar-day-header', textContent:h})));

            const first = new Date(adminYear, adminMonth, 1).getDay();
            const last = new Date(adminYear, adminMonth + 1, 0).getDate();

            for (let i = 0; i < first; i++) grid.appendChild(Object.assign(document.createElement('div'), { className: 'calendar-day-cell empty' }));

            for (let d = 1; d <= last; d++) {
                const dateStr = `${adminYear}-${String(adminMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const dayOfWeek = new Date(adminYear, adminMonth, d).getDay();
                const slots = (dayOfWeek === 0 || dayOfWeek === 6) ? 
                    ["10:00 - 14:00 (주말 1부)", "14:00 - 18:00 (주말 2부)", "18:00 - 22:00 (주말 3부)"] : 
                    ["19:00 - 23:00 (평일 야간)"];

                const dayBookings = cachedBookings.filter(b => b.date === dateStr);
                const count = dayBookings.length;
                const totalCap = slots.length * 4;

                const cell = document.createElement('div');
                cell.className = 'calendar-day-cell';
                
                if (dateStr === todayStr) {
                    cell.classList.add('is-today');
                }

                cell.innerHTML = `
                    <span class="day-number">${d}</span>
                    <span class="day-status-badge ${count >= totalCap ? 'full' : count > 0 ? 'reserved' : 'available'}">
                        ${count >= totalCap ? '매진' : count > 0 ? `${count}/${totalCap} 완료` : '여유'}
                    </span>
                `;

                cell.onclick = () => {
                    document.querySelectorAll('#admin-calendar-grid .calendar-day-cell').forEach(c => c.classList.remove('selected'));
                    cell.classList.add('selected');
                    showDaySeatDetails(dateStr, slots);
                };

                grid.appendChild(cell);
            }
        }

        function showDaySeatDetails(dateStr, slots) {
            const title = document.getElementById('admin-detail-title');
            const container = document.getElementById('admin-detail-slots');
            title.textContent = `📌 ${dateStr} 좌석별 예약 현황`;
            container.innerHTML = '';

            slots.forEach(slot => {
                const slotBookings = cachedBookings.filter(b => b.date === dateStr && b.time === slot);
                const slotBox = document.createElement('div');
                slotBox.className = 'slot-item';
                slotBox.style.marginBottom = '10px';

                let seatCardsHTML = '';
                ["M01", "M02", "M03", "M04"].forEach(seat => {
                    const booked = slotBookings.find(b => b.seat === seat);
                    if (booked) {
                        const userObj = cachedUsersMap[booked.userId] || {};
                        let displayId = booked.userId;
                        if(userObj.isDeleted) {
                            displayId = `<span style="color:#ef4444; font-weight:bold;">${booked.userId}(탈퇴)</span>`;
                        }

                        seatCardsHTML += `
                            <div style="background:#fef3c7; border:1px solid #f59e0b; padding:8px; border-radius:6px; font-size:0.8rem; text-align:center;">
                                <strong style="color:#b45309;">${seat}</strong><br>
                                <span style="font-weight:bold; color:#1e293b;">${booked.userName}</span><br>
                                <span style="font-size:0.75rem;">(${displayId})</span>
                            </div>`;
                    } else {
                        seatCardsHTML += `
                            <div style="background:#f1f5f9; border:1px solid #cbd5e1; padding:8px; border-radius:6px; font-size:0.8rem; text-align:center; color:#94a3b8;">
                                <strong>${seat}</strong><br>
                                <span>(빈 자리)</span>
                            </div>`;
                    }
                });

                slotBox.innerHTML = `
                    <h4 style="font-size:0.9rem; margin-bottom:8px; color:#334155;">⏰ ${slot}</h4>
                    <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:8px;">
                        ${seatCardsHTML}
                    </div>
                `;
                container.appendChild(slotBox);
            });
        }

        async function approveUser(userId) {
            await db.collection('users').doc(userId).update({ approved: true });
            alert(`${userId} 회원의 클래스 신청이 승인되었습니다.`);
        }

        async function reApproveUser(userId) {
            if(!confirm(`${userId} 회원의 사용시간 및 승인을 초기화하시겠습니까?\n재승인 시 회원이 마이페이지에서 새로운 클래스를 다시 선택/신청할 수 있게 됩니다.`)) return;
            await db.collection('users').doc(userId).update({ 
                usedHours: 0,
                totalHours: 0,
                classType: "미지정",
                passSeat: null,
                approved: false,
                isCanceled: false
            });
            alert(`${userId} 회원의 시간이 성공적으로 초기화되었습니다.`);
        }

        document.getElementById('admin-prev-btn').onclick = () => { adminMonth--; if(adminMonth<0){adminMonth=11; adminYear--;} renderAdminCalendar(); };
        document.getElementById('admin-next-btn').onclick = () => { adminMonth++; if(adminMonth>11){adminMonth=0; adminYear++;} renderAdminCalendar(); };

        document.addEventListener('DOMContentLoaded', () => {
            loadNoticeImageAdmin();
            listenAdminData();
        });
    </script>
</body>
</html>
