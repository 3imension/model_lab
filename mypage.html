<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>MOLAB - 내 정보 관리</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="main-header">
            <a href="index.html" class="logo-area">
                <div class="logo-icon">ML</div>
                <div class="logo-text">
                    <h1>MOLAB</h1>
                    <span>Plastic model & 3D Printing Studio NOWON Goneung</span>
                </div>
            </a>
            <nav class="nav-buttons" id="nav-buttons"></nav>
        </header>

        <main class="card-section">
            <h2 style="margin-bottom: 15px;">회원 정보 및 클래스 현황</h2>
            <table class="admin-table" style="margin-bottom: 20px;">
                <tr><th>이름</th><td id="my-name">-</td><th>아이디</th><td id="my-id">-</td></tr>
                <tr><th>연락처</th><td id="my-phone">-</td><th>이메일</th><td id="my-email">-</td></tr>
                <tr><th>이용 클래스</th><td id="my-class">-</td><th>승인 상태</th><td id="my-status">-</td></tr>
                <tr><th>총 제공 시간</th><td id="my-total">-</td><th>사용 / 잔여 시간</th><td id="my-remain">-</td></tr>
            </table>

            <!-- 🎯 "월" 단어가 완전히 제거된 클래스 선택 메뉴 -->
            <div style="background: #f8fafc; border: 1px solid #cbd5e1; padding: 16px; border-radius: 8px; margin-bottom: 25px;">
                <h3 style="font-size: 1rem; margin-bottom: 10px; color: #1e293b;">📋 이용 클래스 신청 / 변경</h3>
                <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
                    <select id="user-class-select" style="max-width: 320px;" onchange="togglePassSeatSelect()">
                        <option value="">클래스를 선택하세요</option>
                        <option value="BASIC_1">BASIC (1회/5시간)</option>
                        <option value="BASIC_4">BASIC (4회/20시간)</option>
                        <option value="BASIC_8">BASIC (8회/40시간)</option>
                        <option value="BASIC_16">BASIC (16회/80시간)</option>
                        <option value="FREE_PASS">자유이용권 (M01/M03 전용좌석)</option>
                        <option value="CREATOR">CREATOR (8회/40시간)</option>
                    </select>

                    <select id="pass-seat-select" style="max-width: 180px; display: none;">
                        <option value="">전용좌석 선택</option>
                        <option value="M01">M01 좌석 지정</option>
                        <option value="M03">M03 좌석 지정</option>
                    </select>

                    <button onclick="requestClassChange()" class="nav-btn btn-primary">클래스 신청하기</button>
                </div>
                <p style="font-size: 0.8rem; color: #64748b; margin-top: 8px;">* 신청 후 공방장(관리자)의 승인을 받으면 예약을 진행하실 수 있습니다.</p>
            </div>

            <h3>내 좌석 예약 내역</h3>
            <table class="admin-table" style="margin-top: 10px;">
                <thead><tr><th>예약 날짜</th><th>시간대</th><th>좌석</th><th>상태 / 취소</th></tr></thead>
                <tbody id="my-booking-list">
                    <tr><td colspan="4">예약 내역을 불러오는 중...</td></tr>
                </tbody>
            </table>

            <div style="margin-top: 30px; border-top: 1px solid #e2e8f0; padding-top: 15px;">
                <button onclick="deleteAccount()" class="nav-btn btn-danger">회원 탈퇴하기</button>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
    <script>
        const session = getCurrentUser();
        if (!session) { alert('로그인이 필요합니다.'); window.location.href = 'login.html'; }

        function togglePassSeatSelect() {
            const classVal = document.getElementById('user-class-select').value;
            const seatSelect = document.getElementById('pass-seat-select');
            seatSelect.style.display = (classVal === 'FREE_PASS') ? 'inline-block' : 'none';
        }

        async function loadMyInfo() {
            try {
                if (!db) return;

                const myId = String(session.id).trim();
                const userDoc = await db.collection('users').doc(myId).get();
                const user = userDoc.exists ? userDoc.data() : session;

                document.getElementById('my-name').textContent = user.name || '-';
                document.getElementById('my-id').textContent = user.id || '-';
                document.getElementById('my-phone').textContent = user.phone || '-';
                document.getElementById('my-email').textContent = user.email || '-';
                
                let classText = user.classType || '미지정';
                if(user.passSeat) classText += ` (${user.passSeat} 전용)`;
                document.getElementById('my-class').textContent = classText;
                
                document.getElementById('my-status').textContent = user.approved ? '승인 완료' : '승인 대기중';
                
                const total = Number(user.totalHours || 0);
                const used = Number(user.usedHours || 0);
                const remain = total - used;

                document.getElementById('my-total').textContent = `${total} 시간`;
                document.getElementById('my-remain').textContent = `${used} 시간 사용 / ${remain} 시간 남음`;

                // 최적화: 내 ID 기반 직접 조회
                const snapshot = await db.collection('bookings').where('userId', '==', myId).get();
                const list = document.getElementById('my-booking-list');
                list.innerHTML = '';

                const myBookings = snapshot.docs.map(doc => ({ docId: doc.id, ...doc.data() }));

                if (myBookings.length === 0) {
                    list.innerHTML = '<tr><td colspan="4">예약 내역이 없습니다.</td></tr>';
                    return;
                }

                myBookings.sort((a, b) => a.date.localeCompare(b.date));

                const now = new Date();
                const todayStr = now.toISOString().split('T')[0];
                const currentHour = now.getHours();

                myBookings.forEach(b => {
                    const tr = document.createElement('tr');
                    let statusBtnHTML = '';

                    if (b.date < todayStr) {
                        statusBtnHTML = `<span style="background:#cbd5e1; color:#475569; padding:4px 10px; border-radius:4px; font-size:0.8rem; font-weight:bold;">사용완료</span>`;
                    } else if (b.date > todayStr) {
                        statusBtnHTML = `<button onclick="cancelBooking('${b.docId}', ${b.hours || 5})" class="nav-btn btn-danger" style="padding: 4px 10px; font-size: 0.8rem;">예약 취소</button>`;
                    } else {
                        const timeStr = b.time || '';
                        let startHour = 0, endHour = 24;

                        if (timeStr.includes("10:00 - 14:00")) { startHour = 10; endHour = 14; }
                        else if (timeStr.includes("14:00 - 18:00")) { startHour = 14; endHour = 18; }
                        else if (timeStr.includes("18:00 - 22:00")) { startHour = 18; endHour = 22; }
                        else if (timeStr.includes("19:00 - 23:00")) { startHour = 19; endHour = 23; }

                        if (currentHour >= startHour && currentHour < endHour) {
                            statusBtnHTML = `<span style="background:#dcfce7; color:#15803d; padding:4px 10px; border-radius:4px; font-size:0.8rem; font-weight:bold;">사용중</span>`;
                        } else if (currentHour >= endHour) {
                            statusBtnHTML = `<span style="background:#cbd5e1; color:#475569; padding:4px 10px; border-radius:4px; font-size:0.8rem; font-weight:bold;">사용완료</span>`;
                        } else {
                            statusBtnHTML = `<button onclick="cancelBooking('${b.docId}', ${b.hours || 5})" class="nav-btn btn-danger" style="padding: 4px 10px; font-size: 0.8rem;">예약 취소</button>`;
                        }
                    }

                    tr.innerHTML = `
                        <td>${b.date}</td>
                        <td>${b.time}</td>
                        <td><strong style="color:#2563eb;">${b.seat}</strong></td>
                        <td>${statusBtnHTML}</td>
                    `;
                    list.appendChild(tr);
                });

            } catch (err) {
                console.error("MyPage Error:", err);
                document.getElementById('my-booking-list').innerHTML = `<tr><td colspan="4" style="color:red;">내역 로딩 오류: ${err.message}</td></tr>`;
            }
        }

        async function requestClassChange() {
            const classVal = document.getElementById('user-class-select').value;
            const passSeat = document.getElementById('pass-seat-select').value;

            if (!classVal) return alert('신청할 클래스를 선택해 주세요.');
            if (classVal === 'FREE_PASS' && !passSeat) {
                return alert('자유이용권은 M01 또는 M03 좌석을 반드시 선택해야 합니다.');
            }

            let total = 0;
            if (classVal === 'BASIC_1') total = 5;
            else if (classVal === 'BASIC_4') total = 20;
            else if (classVal === 'BASIC_8' || classVal === 'CREATOR') total = 40;
            else if (classVal === 'BASIC_16') total = 80;
            else if (classVal === 'FREE_PASS') total = 720;

            const myId = String(session.id).trim();
            await db.collection('users').doc(myId).update({
                classType: classVal,
                passSeat: classVal === 'FREE_PASS' ? passSeat : null,
                totalHours: total,
                usedHours: 0,
                approved: false
            });

            alert('클래스 신청이 완료되었습니다.\n공방장(관리자)의 승인 후 예약을 진행하실 수 있습니다.');
            location.reload();
        }

        async function cancelBooking(docId, hoursToRefund) {
            if (!confirm('해당 예약을 취소하시겠습니까?\n취소 시 사용된 시간이 다시 환불됩니다.')) return;

            try {
                await db.collection('bookings').doc(docId).delete();

                const myId = String(session.id).trim();
                const userRef = db.collection('users').doc(myId);
                const userDoc = await userRef.get();
                if (userDoc.exists) {
                    const currentUsed = Number(userDoc.data().usedHours || 0);
                    await userRef.update({ 
                        usedHours: Math.max(0, currentUsed - Number(hoursToRefund)) 
                    });
                }

                alert('예약이 성공적으로 취소되고 시간이 복구되었습니다.');
                loadMyInfo();
            } catch (err) {
                alert(`예약 취소 오류: ${err.message}`);
            }
        }

        async function deleteAccount() {
            if (!confirm('정말로 탈퇴하시겠습니까? 데이터가 모두 삭제됩니다.')) return;
            try {
                await db.collection('users').doc(String(session.id).trim()).delete();
                localStorage.removeItem('ml_session');
                alert('탈퇴가 완료되었습니다.');
                window.location.href = 'index.html';
            } catch (err) {
                alert(`탈퇴 실패: ${err.message}`);
            }
        }

        document.addEventListener('DOMContentLoaded', loadMyInfo);
    </script>
</body>
</html>
