<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Model Lab - 로그인</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container narrow">
        <main class="card-section">
            <h2 style="margin-bottom: 20px; text-align: center;">로그인</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>아이디</label>
                    <input type="text" id="login-id" required>
                </div>
                <div class="form-group">
                    <label>비밀번호</label>
                    <input type="password" id="login-pw" required>
                </div>
                <button type="submit" class="nav-btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">로그인</button>
            </form>
        </main>
    </div>
    <script src="app.js"></script>
    <script>
        document.getElementById('login-form').onsubmit = (e) => {
            e.preventDefault();
            const id = document.getElementById('login-id').value.trim();
            const pw = document.getElementById('login-pw').value;

            const users = getUsers();
            const user = users.find(u => u.id === id && u.pw === pw);

            if (!user) {
                return alert('아이디 또는 비밀번호가 일치하지 않습니다.');
            }

            if (!user.approved && user.id !== '3imension') {
                return alert('아직 공방장의 가입 승인이 완료되지 않았습니다.');
            }

            localStorage.setItem('ml_session', JSON.stringify(user));
            alert(`${user.name}님 환영합니다!`);
            window.location.href = (user.id === '3imension') ? 'admin.html' : 'index.html';
        };
    </script>
</body>
</html>
