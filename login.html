<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Model Lab - 로그인</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="app-container narrow">
        <main class="card-section">
            <h2 style="margin-bottom: 20px; text-align: center;">로그인</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>아이디</label>
                    <input type="text" id="login-id" required placeholder="아이디 입력">
                </div>
                <div class="form-group">
                    <label>비밀번호</label>
                    <input type="password" id="login-pw" required placeholder="비밀번호 입력">
                </div>
                <button type="submit" id="login-submit-btn" class="nav-btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">로그인</button>
            </form>
            <div id="login-error-msg" style="color: red; margin-top: 10px; font-size: 0.85rem; text-align: center;"></div>
        </main>
    </div>
    <script src="app.js"></script>
    <script>
        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('login-submit-btn');
            const errorMsg = document.getElementById('login-error-msg');
            const id = document.getElementById('login-id').value.trim();
            const pw = document.getElementById('login-pw').value;

            errorMsg.textContent = '';
            submitBtn.disabled = true;
            submitBtn.textContent = '로그인 확인 중...';

            // 1. 관리자 계정 테스트 (DB 상태와 무관하게 무조건 즉시 승인)
            if (id === '3imension' && pw === '1234') {
                const adminUser = { id: '3imension', name: '공방장(관리자)', approved: true };
                localStorage.setItem('ml_session', JSON.stringify(adminUser));
                alert('관리자로 로그인되었습니다.');
                window.location.href = 'admin.html';
                return;
            }

            // 2. 일반 회원 로그인 (DB 조회)
            try {
                if (!db) {
                    throw new Error("Firebase 데이터베이스 초기화 실패 (네트워크 또는 키 오류)");
                }

                const doc = await db.collection('users').doc(id).get();

                if (!doc.exists) {
                    throw new Error(`'${id}' 아이디가 DB에 존재하지 않습니다. 먼저 회원가입을 완료해 주세요.`);
                }

                const userData = doc.data();

                if (userData.pw !== pw) {
                    throw new Error("비밀번호가 일치하지 않습니다.");
                }

                if (!userData.approved) {
                    throw new Error("아직 공방장의 가입 승인이 완료되지 않았습니다. 관리자 페이지(3imension/1234)에서 승인해 주세요.");
                }

                // 로그인 성공 세션 저장
                localStorage.setItem('ml_session', JSON.stringify(userData));
                alert(`${userData.name}님 환영합니다!`);
                window.location.href = 'index.html';

            } catch (err) {
                console.error("Login Error:", err);
                errorMsg.textContent = err.message;
                alert(`[로그인 오류]\n${err.message}`);
                submitBtn.disabled = false;
                submitBtn.textContent = '로그인';
            }
        };
    </script>
</body>
</html>
