<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Model Lab - 좌석 예약</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="main-header">
            <a href="index.html" class="logo-area">
                <div class="logo-icon">ML</div>
                <div class="logo-text"><h1>Model Lab</h1><span>좌석 예약</span></div>
            </a>
            <nav class="nav-buttons" id="nav-buttons"></nav>
        </header>

        <div class="reservation-layout" style="display:grid; grid-template-columns: 1.2fr 1fr; gap: 20px;">
            <main class="card-section">
                <h3>날짜 선택 (2026년 9월)</h3>
                <div id="res-calendar" class="monthly-calendar-grid" style="margin-top:10px;"></div>
            </main>

            <aside class="card-section">
                <h3 id="res-title">날짜를 선택해 주세요</h3>
                <div class="form-group" style="margin-top:10px;">
                    <label>시간대 선택</label>
                    <select id="time-select" disabled></select>
                </div>
                <div class="form-group">
                    <label>좌석 선택 (4자리)</label>
                    <div class="seat-map">
                        <button type="button" class="seat-btn" data-seat="M01" disabled>M01</button>
                        <button type="button" class="seat-btn" data-seat="M02" disabled>M02</button>
                        <button type="button" class="seat-btn" data-seat="M03" disabled>M03</button>
                        <button type="button" class="seat-btn" data-seat="M04" disabled>M04</button>
                    </div>
                </div>
                <button type="button" id="confirm-btn" class="nav-btn btn-primary" style="width:100%; padding:12px;" disabled>예약 확정하기</button>
            </aside>
        </div>
    </div>
    <script src="app.js"></script>
    <script>
        const session = getCurrentUser();
        if (!session || !session.approved) { alert('승인된 회원만 이용 가능합니다.'); window.location.href = 'index.html'; }

        let selDate = '', selTime = '', selSeat = '';
        const seatBtns = document.querySelectorAll('.seat-btn');

        async function renderResCal() {
            const cal = document.getElementById('res-calendar');
            cal.innerHTML = '';
            ['일','월','화','수','목','금','토'].forEach(h => cal.appendChild(Object.assign(document.createElement('div'), {className:'calendar-day-header', textContent:h})));

            const first = new Date(2026, 8, 1).getDay();
            const last = new Date(2026, 9, 0).getDate();

            let bookings = [];
            try {
                const snapshot = await db.collection('bookings').get();
                bookings = snapshot.docs.map(d => d.data());
            } catch(e) {}

            for(let i=0; i<first; i++) cal.appendChild(Object.assign(document.createElement('div'), {className:'calendar-day-cell empty'}));

            for(let d=1; d<=last; d++) {
                const dateStr = `2026-09-${String(d).padStart(2,'0')}`;
                const dayOfWeek = new Date(2026, 8, d).getDay();
                const totalCap = ((dayOfWeek === 0 || dayOfWeek === 6) ? 3 : 1) * 4;
                const count = bookings.filter(b => b.date === dateStr).length;

                const cell = document.createElement('div');
                cell.className = 'calendar-day-cell';
                if(selDate === dateStr) cell.classList.add('selected');

                cell.innerHTML = `
                    <span class="day-number">${d}</span>
                    <span class="day-status-badge ${count >= totalCap ? 'full' : count > 0 ? 'reserved' : 'available'}">
                        ${count >= totalCap ? '매진' : count > 0 ? `${count}/${totalCap} 완료` : '여유'}
                    </span>
                `;
                
                cell.onclick = () => {
                    document.querySelectorAll('#res-calendar .calendar-day-cell').forEach(c => c.classList.remove('selected'));
                    cell.classList.add('selected');
                    selDate = dateStr;
                    selTime = '';
                    selSeat = '';
                    document.getElementById('confirm-btn').disabled = true;
                    document.getElementById('res-title').textContent = `${selDate} 예약`;
                    
                    const timeSel = document.getElementById('time-select');
                    timeSel.disabled = false;
                    const isWeekend = (dayOfWeek % 6 === 0);
                    const slots = isWeekend ? ["10:00 - 14:00 (주말 1부)", "14:00 - 18:00 (주말 2부)", "18:00 - 22:00 (주말 3부)"] : ["19:00 - 23:00 (평일 야간)"];
                    timeSel.innerHTML = '<option value="">시간 선택</option>' + slots.map(s => `<option value="${s}">${s}</option>`).join('');
                    
                    resetSeats();
                };
                cal.appendChild(cell);
            }
        }

        function resetSeats() {
            seatBtns.forEach(btn => {
                btn.classList.remove('selected', 'taken');
                btn.disabled = true;
            });
        }

        async function updateSeatButtons() {
            if(!selDate || !selTime) return;
            const snapshot = await db.collection('bookings')
                .where('date', '==', selDate)
                .where('time', '==', selTime)
                .get();

            const taken = snapshot.docs.map(doc => doc.data().seat);

            seatBtns.forEach(btn => {
                const s = btn.dataset.seat;
                btn.classList.remove('selected', 'taken');
                if(taken.includes(s)) { 
                    btn.classList.add('taken'); 
                    btn.disabled = true; 
                } else { 
                    btn.disabled = false; 
                }
            });
        }

        document.getElementById('time-select').onchange = async (e) => {
            selTime = e.target.value;
            selSeat = '';
            document.getElementById('confirm-btn').disabled = true;
            if(!selTime) {
                resetSeats();
                return;
            }
            await updateSeatButtons();
        };

        seatBtns.forEach(btn => {
            btn.onclick = () => {
                if(btn.classList.contains('taken')) return;
                seatBtns.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selSeat = btn.dataset.seat;
                document.getElementById('confirm-btn').disabled = false;
            };
        });

        document.getElementById('confirm-btn').onclick = async () => {
            const confirmBtn = document.getElementById('confirm-btn');
            confirmBtn.disabled = true;

            // 1. 만료 여부 검사
            const userRef = db.collection('users').doc(session.id);
            const userDoc = await userRef.get();
            if (!userDoc.exists) return;

            const userData = userDoc.data();
            const total = userData.totalHours || 0;
            const used = userData.usedHours || 0;

            if (total <= used) {
                alert('사용시간이 만료되었습니다');
                confirmBtn.disabled = false;
                return;
            }

            // 2. 중복 예약 검증 (동일 날짜, 시간, 좌석)
            const duplicateCheck = await db.collection('bookings')
                .where('date', '==', selDate)
                .where('time', '==', selTime)
                .where('seat', '==', selSeat)
                .get();

            if (!duplicateCheck.empty) {
                alert('이미 다른 회원이 예약한 좌석입니다. 다른 좌석을 선택해 주세요.');
                await updateSeatButtons();
                return;
            }

            // 3. 예약 등록
            await db.collection('bookings').add({
                userId: session.id,
                userName: session.name,
                date: selDate,
                time: selTime,
                seat: selSeat,
                hours: 4,
                createdAt: new Date()
            });

            await userRef.update({ usedHours: used + 4 });

            alert(`[예약 완료]\n일시: ${selDate} / ${selTime}\n좌석: ${selSeat}\n\n연이어 다음 예약을 진행하실 수 있습니다.`);
            
            // 4. 머물기 & UI 실시간 리셋
            selSeat = '';
            await updateSeatButtons();
            await renderResCal();
        };

        document.addEventListener('DOMContentLoaded', renderResCal);
    </script>
</body>
</html>
