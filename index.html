<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOLAB - Plastic model & 3D Printing Studio NOWON Goneung</title>
    <!-- 캐시 갱신을 위해 ?v=1.1 추가 -->
    <link rel="stylesheet" href="style.css?v=1.1">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="main-header">
            <a href="index.html" class="logo-area">
                <div class="logo-icon">ML</div>
                <div class="logo-text">
                    <h1>MOLAB</h1>
                    <span>Plastic model & 3D Printing Studio NOWON Goneung</span>
                </div>
            </a>
            <nav class="nav-buttons" id="nav-buttons">
                <a href="login.html" class="nav-btn btn-secondary">로그인</a>
                <a href="register.html" class="nav-btn btn-primary">회원가입</a>
            </nav>
        </header>

        <section class="card-section" id="notice-img-card" style="display:none; margin-bottom: 20px; text-align: center; padding: 15px;">
            <img id="main-notice-img" style="max-width: 100%; height: auto; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
        </section>

        <main class="card-section">
            <div class="calendar-nav-header">
                <button id="prev-btn" class="nav-btn btn-secondary">&lt; 이전 달</button>
                <h2 id="month-title"></h2>
                <button id="next-btn" class="nav-btn btn-secondary">다음 달 &gt;</button>
            </div>
            
            <div id="calendar-grid" class="monthly-calendar-grid"></div>
        </main>
    </div>

    <script src="app.js"></script>
    <script>
        const now = new Date();
        let year = now.getFullYear();
        let month = now.getMonth();
        const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

        function loadNoticeImage() {
            if(!db) return;
            const cachedImg = sessionStorage.getItem('cached_notice_img');
            if(cachedImg) {
                document.getElementById('main-notice-img').src = cachedImg;
                document.getElementById('notice-img-card').style.display = 'block';
            }

            db.collection('settings').doc('notice_image').get().then(doc => {
                if (doc.exists && doc.data().url) {
                    const imgUrl = doc.data().url;
                    sessionStorage.setItem('cached_notice_img', imgUrl);
                    document.getElementById('main-notice-img').src = imgUrl;
                    document.getElementById('notice-img-card').style.display = 'block';
                } else {
                    sessionStorage.removeItem('cached_notice_img');
                    document.getElementById('notice-img-card').style.display = 'none';
                }
            }).catch(err => console.log(err));
        }

        async function renderMainCalendar() {
            document.getElementById('month-title').textContent = `${year}년 ${month + 1}월`;
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            const headers = ['일', '월', '화', '수', '목', '금', '토'];
            headers.forEach((h, idx) => {
                const div = document.createElement('div');
                div.className = `calendar-day-header ${idx === 0 ? 'sun' : idx === 6 ? 'sat' : ''}`;
                div.textContent = h;
                grid.appendChild(div);
            });

            const first = new Date(year, month, 1).getDay();
            const last = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < first; i++) {
                grid.appendChild(Object.assign(document.createElement('div'), { className: 'calendar-day-cell empty' }));
            }

            let bookings = [];
            if(db) {
                try {
                    const startStr = `${year}-${String(month + 1).padStart(2, '0')}-01`;
                    const endStr = `${year}-${String(month + 1).padStart(2, '0')}-31`;
                    const snapshot = await db.collection('bookings')
                        .where('date', '>=', startStr)
                        .where('date', '<=', endStr)
                        .get();
                    bookings = snapshot.docs.map(doc => doc.data());
                } catch(e) {}
            }

            for (let d = 1; d <= last; d++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const dayOfWeek = new Date(year, month, d).getDay();
                const slotsCount = (dayOfWeek === 0 || dayOfWeek === 6) ? 3 : 1;
                const totalCap = slotsCount * 4;

                const count = bookings.filter(b => b.date === dateStr).length;

                const cell = document.createElement('div');
                cell.className = 'calendar-day-cell';
                
                if (dateStr === todayStr) {
                    cell.classList.add('is-today');
                }

                cell.innerHTML = `
                    <span class="day-number">${d}</span>
                    <span class="day-status-badge ${count >= totalCap ? 'full' : count > 0 ? 'reserved' : 'available'}">
                        ${count >= totalCap ? '매진' : count > 0 ? `${count}/${totalCap} 완료` : '여유'}
                    </span>
                `;
                grid.appendChild(cell);
            }
        }

        document.getElementById('prev-btn').onclick = () => { month--; if (month < 0) { month = 11; year--; } renderMainCalendar(); };
        document.getElementById('next-btn').onclick = () => { month++; if (month > 11) { month = 0; year--; } renderMainCalendar(); };
        
        document.addEventListener('DOMContentLoaded', () => {
            loadNoticeImage();
            renderMainCalendar();
        });
    </script>
</body>
</html>
