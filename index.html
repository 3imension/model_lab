<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Model Lab - 프라공방 예약 시스템</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="main-header">
            <a href="index.html" class="logo-area">
                <div class="logo-icon">ML</div>
                <div class="logo-text">
                    <h1>Model Lab</h1>
                    <span>노원구 공릉동 프라모델 / 3D 프린팅 공방</span>
                </div>
            </a>
            <!-- 자바스크립트 로딩 전에도 기본 노출되는 Fallback 버튼 -->
            <nav class="nav-buttons" id="nav-buttons">
                <a href="login.html" class="nav-btn btn-secondary">로그인</a>
                <a href="register.html" class="nav-btn btn-primary">회원가입</a>
            </nav>
        </header>

        <!-- 공지사항 카드 -->
        <section class="card-section" id="notice-card" style="display:none; margin-bottom: 20px; background: #fffbe2; border: 1px solid #ffe58f;">
            <h3 style="color: #d48806; margin-bottom: 8px;">📢 공지사항</h3>
            <div id="notice-content" style="line-height: 1.6; color: #1e293b; white-space: pre-wrap;"></div>
        </section>

        <main class="card-section">
            <div class="calendar-nav-header">
                <button id="prev-btn" class="nav-btn btn-secondary">&lt; 이전 달</button>
                <h2 id="month-title">2026년 9월</h2>
                <button id="next-btn" class="nav-btn btn-secondary">다음 달 &gt;</button>
            </div>
            
            <div id="calendar-grid" class="monthly-calendar-grid"></div>
        </main>
    </div>

    <script src="app.js"></script>
    <script>
        let year = 2026, month = 8;

        function loadNotice() {
            if(!db) return;
            db.collection('settings').doc('notice').onSnapshot(doc => {
                if (doc.exists && doc.data().content) {
                    const data = doc.data();
                    const card = document.getElementById('notice-card');
                    const content = document.getElementById('notice-content');
                    
                    content.textContent = data.content;
                    content.style.fontSize = (data.fontSize || 15) + 'px';
                    content.style.fontWeight = data.fontWeight || 'normal';
                    card.style.display = 'block';
                } else {
                    document.getElementById('notice-card').style.display = 'none';
                }
            }, err => console.log("Notice status:", err));
        }

        async function renderMainCalendar() {
            document.getElementById('month-title').textContent = `${year}년 ${month + 1}월`;
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            const headers = ['일', '월', '화', '수', '목', '금', '토'];
            headers.forEach((h, idx) => {
                const div = document.createElement('div');
                div.className = `calendar-day-header ${idx === 0 ? 'sun' : idx === 6 ? 'sat' : ''}`;
                div.textContent = h;
                grid.appendChild(div);
            });

            const first = new Date(year, month, 1).getDay();
            const last = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < first; i++) {
                grid.appendChild(Object.assign(document.createElement('div'), { className: 'calendar-day-cell empty' }));
            }

            let bookings = [];
            if(db) {
                try {
                    const snapshot = await db.collection('bookings').get();
                    bookings = snapshot.docs.map(doc => doc.data());
                } catch(e) {
                    console.warn("DB 연결 확인 중...", e);
                }
            }

            for (let d = 1; d <= last; d++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const dayOfWeek = new Date(year, month, d).getDay();
                const slotsCount = (dayOfWeek === 0 || dayOfWeek === 6) ? 3 : 1;
                const totalCap = slotsCount * 4;

                const count = bookings.filter(b => b.date === dateStr).length;

                const cell = document.createElement('div');
                cell.className = 'calendar-day-cell';
                cell.innerHTML = `
                    <span class="day-number">${d}</span>
                    <span class="day-status-badge ${count >= totalCap ? 'full' : count > 0 ? 'reserved' : 'available'}">
                        ${count >= totalCap ? '매진' : count > 0 ? `${count}/${totalCap} 완료` : '여유'}
                    </span>
                `;
                grid.appendChild(cell);
            }
        }

        document.getElementById('prev-btn').onclick = () => { month--; if (month < 0) { month = 11; year--; } renderMainCalendar(); };
        document.getElementById('next-btn').onclick = () => { month++; if (month > 11) { month = 0; year--; } renderMainCalendar(); };
        
        document.addEventListener('DOMContentLoaded', () => {
            loadNotice();
            renderMainCalendar();
        });
    </script>
</body>
</html>
