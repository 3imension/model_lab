<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Model Lab - 회원가입</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="app-container narrow">
        <main class="card-section">
            <h2 style="margin-bottom: 12px;">회원가입</h2>

            <div class="alert-notice">
                📢 <strong>필독:</strong> 회원 가입하시면, 공방장이 연락드립니다. 먼저 협의하신 뒤 클래스 선택 및 예약을 진행해 주세요. 감사합니다 :)
            </div>

            <form id="reg-form">
                <div class="form-group">
                    <label>아이디</label>
                    <div class="form-row">
                        <input type="text" id="reg-id" required placeholder="아이디 입력">
                        <button type="button" id="check-id-btn" class="nav-btn btn-secondary" style="white-space:nowrap;">중복 확인</button>
                    </div>
                    <div id="id-check-msg" style="font-size: 0.8rem; margin-top: 4px;"></div>
                </div>
                <div class="form-group">
                    <label>비밀번호</label>
                    <input type="password" id="reg-pw" required placeholder="비밀번호 입력">
                </div>
                <div class="form-group">
                    <label>실명</label>
                    <input type="text" id="reg-name" required placeholder="이름 입력">
                </div>
                <div class="form-group">
                    <label>연락처</label>
                    <input type="tel" id="reg-phone" placeholder="010-0000-0000" required>
                </div>
                <div class="form-group">
                    <label>이메일</label>
                    <input type="email" id="reg-email" required placeholder="example@email.com">
                </div>
                <button type="submit" id="reg-submit-btn" class="nav-btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">가입 신청하기</button>
            </form>
        </main>
    </div>
    <script src="app.js"></script>
    <script>
        let isIdChecked = false;

        document.getElementById('check-id-btn').onclick = async () => {
            const idInput = document.getElementById('reg-id');
            const checkBtn = document.getElementById('check-id-btn');
            const msgDiv = document.getElementById('id-check-msg');
            const id = idInput.value.trim();

            if (!id) {
                alert('아이디를 입력해 주세요.');
                idInput.focus();
                return;
            }

            checkBtn.disabled = true;
            checkBtn.textContent = '확인 중...';
            msgDiv.textContent = '';

            try {
                if (!db) {
                    throw new Error("데이터베이스 연결에 실패했습니다. app.js 설정을 확인해 주세요.");
                }

                // 관리자 ID 예약어 검사
                if (id === '3imension') {
                    isIdChecked = false;
                    msgDiv.style.color = 'red';
                    msgDiv.textContent = '❌ 사용 불가능한 아이디입니다.';
                    alert('사용 불가능한 아이디입니다.');
                    return;
                }

                const doc = await db.collection('users').doc(id).get();

                if (doc.exists) {
                    isIdChecked = false;
                    msgDiv.style.color = 'red';
                    msgDiv.textContent = '❌ 이미 사용 중인 아이디입니다.';
                    alert('이미 사용 중인 아이디입니다.');
                } else {
                    isIdChecked = true;
                    msgDiv.style.color = 'green';
                    msgDiv.textContent = '✅ 사용 가능한 아이디입니다.';
                    alert('사용 가능한 아이디입니다!');
                }
            } catch (err) {
                console.error("ID Check Error:", err);
                alert(`아이디 중복 확인 중 오류 발생:\n${err.message}`);
            } finally {
                checkBtn.disabled = false;
                checkBtn.textContent = '중복 확인';
            }
        };

        // 아이디 입력창을 수정하면 중복 확인 상태 초기화
        document.getElementById('reg-id').oninput = () => {
            isIdChecked = false;
            document.getElementById('id-check-msg').textContent = '';
        };

        document.getElementById('reg-form').onsubmit = async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('reg-submit-btn');

            if (!isIdChecked) {
                alert('아이디 중복 확인을 진행해 주세요.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '가입 신청 처리 중...';

            const userId = document.getElementById('reg-id').value.trim();

            try {
                await db.collection('users').doc(userId).set({
                    id: userId,
                    pw: document.getElementById('reg-pw').value,
                    name: document.getElementById('reg-name').value,
                    phone: document.getElementById('reg-phone').value,
                    email: document.getElementById('reg-email').value,
                    approved: false,
                    classType: '미지정',
                    totalHours: 0,
                    usedHours: 0,
                    createdAt: new Date()
                });

                alert('회원가입 신청이 완료되었습니다.\n공방장의 승인 후 로그인이 가능합니다.');
                window.location.href = 'login.html';
            } catch (err) {
                console.error("Register Error:", err);
                alert(`가입 신청 처리 실패:\n${err.message}`);
                submitBtn.disabled = false;
                submitBtn.textContent = '가입 신청하기';
            }
        };
    </script>
</body>
</html>
