<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Model Lab - 회원가입</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container narrow">
        <main class="card-section">
            <h2 style="margin-bottom: 12px;">회원가입</h2>

            <div class="alert-notice">
                📢 <strong>필독:</strong> 회원 가입 하시면, 공방장이 연락드립니다. 먼저 협의하신 뒤 클래스 선택 및 예약을 진행해 주세요. 감사합니다 :)
            </div>

            <form id="reg-form">
                <div class="form-group">
                    <label>아이디</label>
                    <div class="form-row">
                        <input type="text" id="reg-id" required>
                        <button type="button" id="check-id-btn" class="nav-btn btn-secondary" style="white-space:nowrap;">중복 확인</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>비밀번호</label>
                    <input type="password" id="reg-pw" required>
                </div>
                <div class="form-group">
                    <label>실명</label>
                    <input type="text" id="reg-name" required>
                </div>
                <div class="form-group">
                    <label>연락처</label>
                    <input type="tel" id="reg-phone" placeholder="010-0000-0000" required>
                </div>
                <div class="form-group">
                    <label>이메일</label>
                    <input type="email" id="reg-email" required>
                </div>
                <button type="submit" class="nav-btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">가입 신청하기</button>
            </form>
        </main>
    </div>
    <script src="app.js"></script>
    <script>
        let isIdChecked = false;

        document.getElementById('check-id-btn').onclick = () => {
            const id = document.getElementById('reg-id').value.trim();
            if (!id) return alert('아이디를 입력하세요.');
            const users = getUsers();
            if (users.some(u => u.id === id)) {
                alert('이미 사용 중인 아이디입니다.');
                isIdChecked = false;
            } else {
                alert('사용 가능한 아이디입니다.');
                isIdChecked = true;
            }
        };

        document.getElementById('reg-id').oninput = () => { isIdChecked = false; };

        document.getElementById('reg-form').onsubmit = (e) => {
            e.preventDefault();
            if (!isIdChecked) return alert('아이디 중복 확인을 완료해 주세요.');

            const users = getUsers();
            users.push({
                id: document.getElementById('reg-id').value.trim(),
                pw: document.getElementById('reg-pw').value,
                name: document.getElementById('reg-name').value,
                phone: document.getElementById('reg-phone').value,
                email: document.getElementById('reg-email').value,
                approved: false, // 공방장 승인 대기
                classType: '미지정',
                totalHours: 0,
                usedHours: 0
            });

            localStorage.setItem('ml_users', JSON.stringify(users));
            alert('회원가입 신청이 완료되었습니다.\n공방장의 승인 후 로그인이 가능합니다.');
            window.location.href = 'login.html';
        };
    </script>
</body>
</html>
